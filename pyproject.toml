[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizador-inventario-pef"
version = "1.0.0"
description = "Optimizador de Inventario y Preparación de Pedidos - Programación Eficiente UBP (Opción 6)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Equipo de Desarrollo - Opción 6" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "flet>=0.25.0",
    "flet-desktop>=0.25.0",
    "elastic-apm>=6.26.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Tests, lint y profilers. Las versiones exactas quedan fijadas en uv.lock.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "line_profiler>=4.1.0",
    "memory_profiler>=0.61.0",
    "scalene>=1.5.0",
    "ruff>=0.4.0",
    "complexipy>=5.0",
    "pytest-benchmark>=4.0.0",
]
# Empaquetado del ejecutable (PyInstaller) y del paquete Python.
empaquetado = [
    "pyinstaller>=6.4.0",
    "build>=1.1.0",
]
# Documentación del proyecto (Sphinx, tema Furo y MyST Parser).
docs = [
    "sphinx>=8.0.0",
    "furo>=2024.8.6",
    "myst-parser>=4.0.0",
]

[project.scripts]
optimizador-inventario = "src.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "automations*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
# Mide también el código que corre en los workers del ProcessPoolExecutor.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true
omit = [
    "tests/*",
    "benchmarks/*",
    "automations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
# PEP 8 admite hasta 99 caracteres por línea si el equipo lo acuerda.
line-length = 99
target-version = "py310"
extend-exclude = [".agents", ".cursor", ".impeccable", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (errores PEP 8)
    "W",    # pycodestyle (advertencias PEP 8)
    "F",    # pyflakes (imports y variables sin uso, etc.)
    "I",    # isort (orden de imports)
    "N",    # pep8-naming (convenciones de nombres)
    "B",    # flake8-bugbear (errores probables)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade (sintaxis moderna para py310)
    "D",    # pydocstyle (docstrings)
    "C90",  # mccabe (complejidad ciclomática)
    "PLR2004",  # números mágicos: usar constantes con nombre
]
ignore = [
    "D107",  # los argumentos del constructor se documentan en la docstring de la clase
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"benchmarks/perfilar_scalene.py" = ["E402"]
# En los tests el nombre de la función ya describe el caso y los valores esperados
# son literales a propósito.
"tests/**" = ["D1", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# Estilo Google con secciones en español (Argumentos, Retorna, Lanza): las interpreta
# Sphinx con napoleon_custom_sections (fase F8).
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src", "automations", "benchmarks", "scripts"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.complexipy]
# Complejidad cognitiva máxima por función: el mismo umbral que usa SonarQube (S3776).
paths = ["src", "automations", "benchmarks", "scripts", "main.py"]
max-complexity-allowed = 15
