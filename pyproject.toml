[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizador-inventario-pef"
version = "1.0.0"
description = "Optimizador de Inventario y Preparación de Pedidos - Programación Eficiente UBP (Opción 6)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Equipo de Desarrollo - Opción 6" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "flet>=0.25.0",
    "elastic-apm>=6.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "line_profiler>=4.1.0",
    "memory_profiler>=0.61.0",
    "scalene>=1.5.0",
    "pyinstaller>=6.4.0",
    "build>=1.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
optimizador-inventario = "src.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "automations*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
# Mide también el código que corre en los workers del ProcessPoolExecutor.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true
omit = [
    "tests/*",
    "benchmarks/*",
    "automations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
# PEP 8 admite hasta 99 caracteres por línea si el equipo lo acuerda.
line-length = 99
target-version = "py310"
extend-exclude = [".agents", ".cursor", ".impeccable", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (errores PEP 8)
    "W",    # pycodestyle (advertencias PEP 8)
    "F",    # pyflakes (imports y variables sin uso, etc.)
    "I",    # isort (orden de imports)
    "N",    # pep8-naming (convenciones de nombres)
    "B",    # flake8-bugbear (errores probables)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade (sintaxis moderna para py310)
]
# E501: las líneas largas que el formateador no puede partir (strings y comentarios)
# se corrigen a mano en la fase F7 (legibilidad). Ver docs/planificacion-parcial-2.md.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"benchmarks/perfilar_scalene.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src", "automations", "benchmarks", "scripts"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
