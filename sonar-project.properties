# Configuración del análisis de SonarQube Cloud.
# El análisis corre desde GitHub Actions (.github/workflows/verify.yml, job "sonarqube").
sonar.organization=gastmolina267
sonar.projectKey=GastMolina267_PEF-Optimizador-de-Inventario
sonar.projectName=Optimizador de Inventario y Pedidos (PEF - Opción 6)

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

# Código a analizar y pruebas
sonar.sources=src,automations,benchmarks,scripts,main.py
sonar.tests=tests

# Reportes externos generados en el CI
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.ruff.reportPaths=ruff-report.json

# La cobertura se mide solo sobre src/ (ver [tool.coverage.run] en pyproject.toml).
# Benchmarks, automatizaciones y scripts de build no se cuentan como código sin cubrir.
sonar.coverage.exclusions=benchmarks/**,automations/**,scripts/**,main.py

# pythonsecurity:S8707 ("argumentos de línea de comandos usados en archivos") en benchmarks/:
# son herramientas que corre el propio grupo para medir; no reciben datos de terceros.
# Igual validan sus argumentos: rutas dentro del repo y rangos numéricos acotados.
sonar.issue.ignore.multicriteria=s8707bench,s2245bench,s2245gen
sonar.issue.ignore.multicriteria.s8707bench.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.s8707bench.resourceKey=benchmarks/**

# python:S2245 ("generador pseudoaleatorio inseguro"): random.Random(semilla) se usa solo
# para generar datasets sintéticos reproducibles. Que sea determinista es el objetivo;
# no hay claves, tokens ni nada que dependa de que sea impredecible.
sonar.issue.ignore.multicriteria.s2245bench.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.s2245bench.resourceKey=benchmarks/generar_datos.py
sonar.issue.ignore.multicriteria.s2245gen.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.s2245gen.resourceKey=src/datos/generador_archivos.py
