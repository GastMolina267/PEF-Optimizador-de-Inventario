name: CD - Compilación y Empaquetado de la Aplicación

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      create_release:
        description: '¿Publicar GitHub Release con los artefactos compilados?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Nombre del tag/etiqueta para el Release (ej. v1.0.0). Por defecto toma la versión de pyproject.toml'
        required: false
        type: string
        default: ''
      mode:
        description: 'Modo de empaquetado de PyInstaller'
        required: true
        type: choice
        options:
          - onedir
          - onefile
        default: onedir

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  UV_PYTHON_PREFERENCE: only-system
  # Inputs del disparo manual como variables de entorno: nunca se interpolan en scripts.
  MODO_EMPAQUETADO: ${{ inputs.mode || 'onedir' }}

# Solo lectura por defecto; el job que publica el Release pide escritura.
permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Compilación de Ejecutables Standalone Nativos (Windows & Linux)
  # =========================================================================
  build-binaries:
    name: Compilar Binario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: OptimizadorInventario-windows-x64
            archive_file: OptimizadorInventario-windows-x64.zip
          - os: ubuntu-latest
            artifact_name: OptimizadorInventario-linux-x64
            archive_file: OptimizadorInventario-linux-x64.tar.gz

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias y empaquetador desde uv.lock
        run: uv sync --locked --no-build --extra empaquetado

      - name: Compilar aplicación con PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        env:
          ARCHIVO: ${{ matrix.archive_file }}
        run: |
          uv run --no-sync python scripts/compile.py --mode "$env:MODO_EMPAQUETADO" --clean
          Compress-Archive -Path dist/OptimizadorInventario* -DestinationPath "dist/$env:ARCHIVO"

      - name: Compilar aplicación con PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          ARCHIVO: ${{ matrix.archive_file }}
        run: |
          uv run --no-sync python scripts/compile.py --mode "$MODO_EMPAQUETADO" --clean
          tar -czvf "dist/$ARCHIVO" -C dist $(ls dist)

      - name: Subir binario compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_file }}
          retention-days: 30

  # =========================================================================
  # 2. Compilación de Paquete Python Estándar (Wheel y Source Distribution)
  # =========================================================================
  build-python-packages:
    name: Compilar Paquetes Python (Wheel & SDist)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Compilar Wheel y SDist (PEP 517)
        run: uv build

      - name: Subir paquetes Python como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: python-package-wheel-sdist
          path: dist/*
          retention-days: 30

  # =========================================================================
  # 3. Publicación Automática en GitHub Releases (Ante Tags 'v*' o manual)
  # =========================================================================
  publish-release:
    name: Publicar GitHub Release
    needs: [build-binaries, build-python-packages]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar todos los artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organizar archivos para Release
        run: |
          mkdir -p final-release/
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.whl" \) -exec cp {} final-release/ \;
          ls -la final-release/

      - name: Determinar etiqueta de versión (tag)
        id: resolver_tag
        env:
          # El tag lo escribe quien dispara el workflow: va por variable de entorno y se
          # valida, nunca se interpola en el script (evita inyección de comandos).
          TAG_MANUAL: ${{ inputs.tag_name }}
        run: |
          if [ -n "$TAG_MANUAL" ]; then
            if [[ ! "$TAG_MANUAL" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "::error::tag_name inválido: debe empezar con v y usar solo letras, números, . _ -"
              exit 1
            fi
            TAG="$TAG_MANUAL"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(python -c "import re; m=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(m.group(1))")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Etiqueta para el Release: $TAG"

      - name: Publicar Release en GitHub con Binarios Adjuntos
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.resolver_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Optimizador de Inventario ${{ steps.resolver_tag.outputs.tag }}"
          files: final-release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ startsWith(github.ref, 'refs/heads/dev') || contains(steps.resolver_tag.outputs.tag, 'dev') || contains(steps.resolver_tag.outputs.tag, 'rc') }}
