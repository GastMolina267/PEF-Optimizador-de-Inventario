name: CI - Verificación del Proyecto

on:
  push:
    branches: [ main, dev, parcial-2, "p2/**", "p3/**" ]
  pull_request:
    branches: [ main, dev, parcial-2, "p2/**", "p3/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # uv usa el Python que instala actions/setup-python (no descarga otro).
  UV_PYTHON_PREFERENCE: only-system

jobs:
  # =========================================================================
  # ETAPAS 1 A 3: Integración, Calidad Estática, Tipado y Seguridad Rápida
  # =========================================================================
  fast-checks:
    name: 1-3. Calidad Estática, Tipado y Seguridad (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: 1. Compilación de sintaxis bytecode (Zero Syntax Errors)
        run: uv run --no-sync python -m compileall -q src automations benchmarks tests scripts main.py

      - name: 2. Análisis estático con Ruff (PEP 8, imports, nombres, docstrings, complejidad)
        run: uv run --no-sync ruff check .

      - name: 3. Formato con Ruff (sin cambios pendientes)
        run: uv run --no-sync ruff format --check .

      - name: 4. Complejidad cognitiva ≤ 15 por función (mismo umbral que SonarQube)
        run: >-
          uv run --no-sync complexipy src automations benchmarks scripts main.py
          --max-complexity-allowed 15 --failed

      - name: 5. Tipado estático estricto con Mypy
        run: uv run --no-sync mypy src/

      - name: 6. Análisis SAST con Bandit (Reporte SARIF y consola)
        run: |
          uv run --no-sync bandit -r src/ -f sarif -o bandit-report.sarif -ll
          uv run --no-sync bandit -r src/ -ll

      - name: 7. Detección preventiva de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Subir artefacto SARIF de Bandit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif-report
          path: bandit-report.sarif
          retention-days: 7

  # =========================================================================
  # ETAPA 4: Pruebas Funcionales y Cobertura (Matriz Multiplataforma)
  # =========================================================================
  test-suite:
    name: 4. Pruebas (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: fast-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.14" ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: Ejecutar suite modular de pruebas con cobertura (Pytest >= 85%)
        run: >-
          uv run --no-sync python -m pytest tests/ -v
          --cov=src --cov-report=xml:coverage.xml --cov-report=term
          --cov-fail-under=85 --junitxml=pytest-report.xml

      - name: Subir reporte de cobertura (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Subir resultados de pruebas (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: pytest-report.xml
          retention-days: 7

  # =========================================================================
  # ETAPA 5: Seguridad de Dependencias y Validación de Documentación Externa
  # =========================================================================
  deps-and-docs:
    name: 5. Dependencias (SCA) y Documentación Externa
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev --extra docs

      - name: 1. Auditoría de dependencias conocidas (pip-audit)
        run: |
          uv run --no-sync pip-audit -r requirements.txt -r requirements-dev.txt --format json -o pip-audit-report.json
          uv run --no-sync pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Subir reporte JSON de pip-audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-json-report
          path: pip-audit-report.json
          retention-days: 7

      - name: 2. Ejecutar motor de análisis AST de complejidad
        run: uv run --no-sync python -m automations.ejecutar

      - name: 3. Validar integridad de datasets JSON
        run: |
          uv run --no-sync python -c "
          import sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')
          from pathlib import Path
          from src.datos.cargador import cargar_dataset
          from src.datos.validador import ValidadorDataset

          datasets_dir = Path('data/datasets')
          assert datasets_dir.exists(), 'Carpeta data/datasets no existe'
          archivos = list(datasets_dir.glob('*.json'))
          assert len(archivos) >= 4, f'Se esperaban al menos 4 datasets, encontrados {len(archivos)}'

          for ruta in archivos:
              productos, pedidos = cargar_dataset(ruta)
              validador = ValidadorDataset(productos, pedidos)
              res = validador.validar_todo()
              assert res.es_valido, f'Dataset {ruta.name} inválido: {res.errores}'
              print(f'✓ {ruta.name}: {len(productos)} productos, {len(pedidos)} pedidos válidos')
          "

      - name: 4. Validar presentación oral (11 slides y cero delimitadores '$')
        run: |
          python -c "
          import sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')
          import json
          from pathlib import Path

          ruta_json = Path('docs/presentation/slides.json')
          assert ruta_json.exists(), 'docs/presentation/slides.json no existe'
          with open(ruta_json, 'r', encoding='utf-8') as f:
              data = json.load(f)

          slides = data.get('slides', [])
          assert len(slides) == 11, f'Se esperaban 11 slides, encontradas {len(slides)}'

          dollar = chr(36)
          raw_text = json.dumps(data, ensure_ascii=False)
          assert raw_text.count(dollar) == 0, f'Se encontraron {raw_text.count(dollar)} símbolos $ en slides.json'
          print('✓ Presentación validada: 11 diapositivas conformes y 0 símbolos $ detectados.')
          "

      - name: "5. Compilar documentación con Sphinx (-W: cero advertencias)"
        run: uv run --no-sync sphinx-build -W -b html docs/sphinx docs/sphinx/_build/html

      - name: 6. Validar enlaces externos de documentación (Sphinx linkcheck)
        run: uv run --no-sync sphinx-build -b linkcheck docs/sphinx docs/sphinx/_build/linkcheck

      - name: Subir artefacto para GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/parcial-2'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  # =========================================================================
  # ETAPA 6: Rendimiento, Presupuesto de Memoria y Microbenchmarks
  # =========================================================================
  performance-and-memory:
    name: 6. Rendimiento y Presupuesto de Memoria
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: 1. Control de presupuesto de memoria heap (tracemalloc)
        run: uv run --no-sync python -m pytest tests/integracion/test_presupuesto_memoria.py -v

      - name: 2. Microbenchmarks de regresión continua (pytest-benchmark)
        run: >-
          uv run --no-sync python -m pytest tests/integracion/test_benchmarks.py -v
          --benchmark-only --benchmark-json=benchmark-report.json

      - name: 3. Validación smoke de suites de profiling
        run: uv run --no-sync python -m benchmarks.comparar

      - name: Subir reporte de benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json
          retention-days: 14

  # =========================================================================
  # ETAPA 7: Carga de Seguridad SARIF, SonarQube Cloud y Despliegue de Docs
  # =========================================================================
  sarif-upload:
    name: 7. Carga de Reportes SARIF (GitHub Security)
    needs: [fast-checks, deps-and-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar reporte SARIF de Bandit
        uses: actions/download-artifact@v4
        with:
          name: bandit-sarif-report

      - name: Cargar reporte SARIF a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-report.sarif
          category: bandit-sast

  sonarqube:
    name: 7. Análisis de Calidad (SonarQube Cloud)
    needs: test-suite
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar repositorio (historial completo para blame y código nuevo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generar reporte de Ruff para SonarQube (versión de uv.lock)
        run: >-
          uv run --locked --no-build --extra dev ruff check .
          --output-format=json --output-file=ruff-report.json --exit-zero

      - name: Aviso si falta el token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::No hay secret SONAR_TOKEN: se omite el análisis de SonarQube."

      - name: Análisis SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  deploy-docs:
    name: 7. Publicación en GitHub Pages
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/parcial-2') && github.event_name == 'push'
    needs: deps-and-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
