name: CI - Verificación del Proyecto

on:
  push:
    branches: [ main, dev, parcial-2, "p2/**" ]
  pull_request:
    # p2/**: PRs apilados (F7 contra F6, F8 contra F7, ...).
    branches: [ main, dev, parcial-2, "p2/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # uv usa el Python que instala actions/setup-python (no descarga otro).
  UV_PYTHON_PREFERENCE: only-system

jobs:
  # =========================================================================
  # 1. Chequeo de Sintaxis y Análisis Estático
  # =========================================================================
  lint-and-syntax:
    name: Sintaxis y Análisis Estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: Compilación de sintaxis bytecode (Zero Syntax Errors)
        run: uv run --no-sync python -m compileall -q src automations benchmarks tests scripts main.py

      - name: Análisis estático con Ruff (PEP 8, imports, nombres, docstrings, complejidad)
        run: uv run --no-sync ruff check .

      - name: Formato con Ruff (sin cambios pendientes)
        run: uv run --no-sync ruff format --check .

      - name: Complejidad cognitiva ≤ 15 por función (mismo umbral que SonarQube)
        run: >-
          uv run --no-sync complexipy src automations benchmarks scripts main.py
          --max-complexity-allowed 15 --failed

  # =========================================================================
  # 2. Matriz de Pruebas Unitarias y Cobertura (Linux & Windows)
  # =========================================================================
  test-suite:
    name: Pruebas (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-syntax
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.14" ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: Ejecutar suite de pruebas con cobertura (Pytest)
        run: uv run --no-sync python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      # Lo consume el job de SonarQube. Antes la condición pedía Python 3.11,
      # que no está en la matriz, y el reporte nunca se subía.
      - name: Subir reporte de cobertura (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # 3. Verificación de Integridad de Datos, AST y Presentación Oral
  # =========================================================================
  integrity-checks:
    name: Integridad de Datasets, AST y Presentación
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar uv (dependencias fijadas en uv.lock)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Instalar dependencias desde uv.lock (sin compilar paquetes desde fuente)
        run: uv sync --locked --no-build --extra dev

      - name: Ejecutar motor de análisis AST de complejidad
        run: uv run --no-sync python -m automations.ejecutar

      - name: Validar integridad de datasets JSON
        run: |
          uv run --no-sync python -c "
          import sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')
          from pathlib import Path
          from src.datos.cargador import cargar_dataset
          from src.datos.validador import ValidadorDataset

          datasets_dir = Path('data/datasets')
          assert datasets_dir.exists(), 'Carpeta data/datasets no existe'
          archivos = list(datasets_dir.glob('*.json'))
          assert len(archivos) >= 4, f'Se esperaban al menos 4 datasets, encontrados {len(archivos)}'

          for ruta in archivos:
              productos, pedidos = cargar_dataset(ruta)
              validador = ValidadorDataset(productos, pedidos)
              res = validador.validar_todo()
              assert res.es_valido, f'Dataset {ruta.name} inválido: {res.errores}'
              print(f'✓ {ruta.name}: {len(productos)} productos, {len(pedidos)} pedidos válidos')
          "

      - name: Validar presentación oral (cero delimitadores '$' y JSON válido)
        run: |
          python -c "
          import sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')
          import json
          from pathlib import Path

          ruta_json = Path('docs/presentation/slides.json')
          assert ruta_json.exists(), 'docs/presentation/slides.json no existe'
          with open(ruta_json, 'r', encoding='utf-8') as f:
              data = json.load(f)

          slides = data.get('slides', [])
          assert len(slides) == 11, f'Se esperaban 11 slides, encontradas {len(slides)}'

          dollar = chr(36)
          raw_text = json.dumps(data, ensure_ascii=False)
          assert raw_text.count(dollar) == 0, f'Se encontraron {raw_text.count(dollar)} símbolos $ en slides.json'
          print('✓ Presentación validada: 11 diapositivas conformes y 0 símbolos $ detectados.')
          "

  # =========================================================================
  # 4. Análisis de calidad con SonarQube Cloud
  # =========================================================================
  sonarqube:
    name: Análisis de Calidad (SonarQube Cloud)
    needs: test-suite
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Descargar repositorio (historial completo para blame y código nuevo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generar reporte de Ruff para SonarQube (versión de uv.lock)
        run: >-
          uv run --locked --no-build --extra dev ruff check .
          --output-format=json --output-file=ruff-report.json --exit-zero

      - name: Aviso si falta el token
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning::No hay secret SONAR_TOKEN: se omite el análisis de SonarQube."

      - name: Análisis SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
